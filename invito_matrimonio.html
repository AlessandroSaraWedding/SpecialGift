<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito Digitale - Soggiorno Matrimonio</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Times New Roman', serif; overflow: hidden; }
    /* Sfondo */
    body.romantico { background: url('floral-bg.jpg') no-repeat center center/cover; color: #333; }
    body.stellato { background: url('starry-bg.jpg') no-repeat center center/cover; color: #f0f0f0; }
    /* Overlay ombra */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); pointer-events: none; }
    /* Contenitore invito, inizialmente nascosto */
    .container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(255,255,255,0.85); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3); opacity: 0; }
    body.stellato .container { background: rgba(0,0,0,0.6); }
    h1 { font-size: 2.8em; margin-bottom: 0.3em; letter-spacing: 2px; }
    p { font-size: 1.2em; margin: 0.8em 0; line-height: 1.4; }
    .icons { margin: 1.5em 0; font-size: 1.8em; letter-spacing: 8px; }
    .footer { margin-top: 2em; font-style: italic; font-size: 1em; }
    /* Bottone condivisione */
    #share-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; font-size: 1em; border: none; border-radius: 5px; cursor: pointer; }
    /* Animazioni */
    @keyframes zoomIn { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .show .container { animation: zoomIn 0.8s ease-out forwards; }
    /* Fireworks elementari */
    #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 4px; height: 4px; background: radial-gradient(circle, #FFD700 0%, rgba(255,215,0,0) 70%); opacity: 0; border-radius: 50%; }
  </style>
</head>
<body class="romantico">
  <button id="share-btn">Condividi</button>
  <div class="overlay"></div>
  <div class="container">
    <h1>RIMANETE CON NOI!</h1>
    <p>Testimoni & damigelle, siete ufficialmente invitati<br> a trascorrere una notte con noi nella location del matrimonio:</p>
    <p><strong>Le Case – Ristorante & Resort</strong></p>
    <p><strong>8 giugno 2025</strong></p>
    <div class="icons">📍 🏨 🌙 🥂</div>
    <div class="footer">Con affetto, Sara &amp; Alessandro</div>
  </div>
  <div id="fireworks"></div>
  <script>
    const btn = document.getElementById('share-btn');
    const body = document.body;
    const fireworks = document.getElementById('fireworks');
    btn.addEventListener('click', () => {
      body.classList.add('show');
      launchFireworks();
    });
    function launchFireworks() {
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        fireworks.appendChild(particle);
        const angle = Math.random() * 2 * Math.PI;
        const distance = 100 + Math.random() * 100;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        particle.animate([
          { transform: 'translate(0, 0)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'ease-out'
        });
        setTimeout(() => particle.remove(), 1500);
      }
    }
  </script>
</body>
</html>
