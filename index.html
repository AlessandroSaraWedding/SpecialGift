<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invito Digitale - Soggiorno Matrimonio</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Times New Roman', serif; overflow: hidden; }
    /* Sfondo cielo stellato estivo */
    body.stellato { background: url('star-summer-bg.jpg') no-repeat center center/cover; color: #fff; }
    /* Overlay semitrasparente per contrasto */
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,20,0.6); pointer-events: none; }
    /* Contenitore invito */
    .container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(0,0,30,0.7); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.5); opacity: 0; }
    h1 { font-size: 2.8em; margin-bottom: 0.3em; letter-spacing: 2px; color: #fff; }
    p { font-size: 1.2em; margin: 0.8em 0; line-height: 1.4; color: #fff; }
    .icons { margin: 1.5em 0; font-size: 1.8em; letter-spacing: 8px; }
    .footer { margin-top: 2em; font-style: italic; font-size: 1em; color: #ddd; }
    /* Pulsante centrato */
    #share-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 25px; font-size: 1.1em; color: #fff; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 30px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    #share-btn:hover { background: rgba(255,255,255,0.3); }
    /* Input file musica (invisibile di default) */
    #music-input { position: absolute; top: 20px; left: 20px; color: #fff; }
    /* Animazioni */
    @keyframes zoomIn { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 60% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .show .container { animation: zoomIn 0.8s ease-out forwards; }
    /* Fireworks elementari */
    #fireworks { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; width: 4px; height: 4px; background: radial-gradient(circle, #FFD700 0%, rgba(255,215,0,0) 70%); opacity: 0; border-radius: 50%; }
  </style>
</head>
<body class="stellato">
  <!-- Input file per musica -->
  <input type="file" id="music-input" accept="audio/*">
  <!-- Pulsante regalo + toggle musica -->
  <button id="share-btn">Apri il tuo regalo</button>
  <div class="overlay"></div>
  <div class="container">
    <h1>RIMANETE CON NOI!</h1>
    <p>Testimoni & damigelle, siete ufficialmente invitati<br> a trascorrere una notte con noi nella location del matrimonio:</p>
    <p><strong>Le Case – Ristorante & Resort</strong></p>
    <p><strong>8 giugno 2025</strong></p>
    <div class="icons">📍 🏨 🌙 🥂</div>
    <div class="footer">Con affetto, Sara &amp; Alessandro</div>
  </div>
  <div id="fireworks"></div>
  <!-- Elemento audio per musica di sottofondo -->
  <!-- Elemento audio per musica di sottofondo: sostituisci 'musica.mp3' con il tuo file audio nella cartella -->
  <audio id="bg-music" loop src="A Sky Full of Stars.mp3"></audio>
  <script>
    const btn = document.getElementById('share-btn');
    const body = document.body;
    const fireworks = document.getElementById('fireworks');
    const audio = document.getElementById('bg-music');
    const musicInput = document.getElementById('music-input');

    // Carica file audio selezionato
    musicInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        audio.src = url;
      }
    });

    btn.addEventListener('click', () => {
      // Animazione invito
      body.classList.add('show');
      launchFireworks();
      // Toggle musica
      if (audio.paused) {
        audio.play().catch(() => console.warn('Playback disabilitato, nessuna musica caricata.'));
      } else {
        audio.pause();
      }
    });

    /**
     * Funzione semplice per lanciare fuochi d'artificio di particelle
     */
    function launchFireworks() {
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        fireworks.appendChild(particle);
        const angle = Math.random() * 2 * Math.PI;
        const distance = 100 + Math.random() * 100;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        particle.animate([
          { transform: 'translate(0, 0)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'ease-out'
        });
        setTimeout(() => particle.remove(), 1500);
      }
    }
  </script>
</body>
</html>
